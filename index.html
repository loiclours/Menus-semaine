<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c2512f">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Menus de la semaine</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#2b2620;--mu:#7a7266;--ac:#c2512f;--bd:#e8e1d6;--ok:#4d7c4f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1915;--card:#27231e;--tx:#f0ebe2;--mu:#a39a8c;--ac:#e8795a;--bd:#3a352d;--ok:#8ab98c}}
:root[data-theme="dark"]{--bg:#1c1915;--card:#27231e;--tx:#f0ebe2;--mu:#a39a8c;--ac:#e8795a;--bd:#3a352d;--ok:#8ab98c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;max-width:560px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--mu);font-size:14px;margin-bottom:14px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-weight:600}
.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.day{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.day h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:0 0 6px}
.meal{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--bd)}
.meal:first-of-type{border-top:0}
.meal .s{font-size:12px;color:var(--mu);width:42px;flex:none}
.meal .n{flex:1}
.meal .n small{display:block;color:var(--mu);font-size:12px}
.meal.off .n{text-decoration:line-through;color:var(--mu)}
.meal button{border:1px solid var(--bd);background:none;color:var(--ac);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px}
.cat{font-size:13px;font-weight:700;color:var(--ac);margin:16px 0 4px}
.it{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd)}
.it input{width:20px;height:20px;accent-color:var(--ok)}
.it .n{flex:1}.it.done .n{text-decoration:line-through;color:var(--mu)}
.it .q{color:var(--mu);font-size:14px}.it .p{width:60px;text-align:right;font-size:14px}
.tot{position:sticky;bottom:0;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:16px;display:flex;justify-content:space-between;font-weight:700}
.reset{margin-top:18px;width:100%;padding:11px;border:1px dashed var(--bd);background:none;color:var(--mu);border-radius:10px;font:inherit}
.pers{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 12px;margin-bottom:8px}.pers small{font-weight:400;color:var(--mu);font-size:12px}.pers span{flex:1;font-weight:600}.pers button{width:36px;height:36px;border:1px solid var(--bd);background:none;color:var(--ac);border-radius:50%;font:inherit;font-size:20px;line-height:1}.pers b{min-width:22px;text-align:center;font-size:18px}
[hidden]{display:none!important}
.ad{position:relative;margin:14px 0;min-height:90px;border:1px dashed var(--bd);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--mu);font-size:13px;overflow:hidden}
.ad:before{content:"Publicité";position:absolute;top:3px;left:8px;font-size:10px;text-transform:uppercase;letter-spacing:.06em}
.meal .n[data-r]{cursor:pointer}
#rc{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sh{position:relative;background:var(--card);color:var(--tx);width:100%;max-width:560px;max-height:85%;overflow:auto;border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.sh h3{margin:0 36px 4px 0;font-size:19px}
.sh h4{margin:14px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ac)}
.sh ul,.sh ol{margin:0;padding-left:20px}.sh li{margin:5px 0}.sh .q{color:var(--mu)}
.sh .x{position:absolute;top:10px;right:12px;width:36px;height:36px;border:0;background:none;color:var(--mu);font-size:26px}
.note{color:var(--mu);font-size:12px;margin-top:10px}
</style>
</head>
<body>
<h1>Menus de la semaine</h1>
<div class="sub"><span id="wk"></span> · de saison</div>
<div class="pers"><span>Adultes</span><button id="mn" aria-label="Moins d’adultes">−</button><b id="nn">1</b><button id="pl" aria-label="Plus d’adultes">+</button></div>
<div class="pers"><span>Enfants <small>(demi-portion)</small></span><button id="cm" aria-label="Moins d’enfants">−</button><b id="nc">0</b><button id="cp" aria-label="Plus d’enfants">+</button></div>
<div class="tabs"><button id="t1" class="on">Menus</button><button id="t2">Courses</button></div>
<div id="v1"></div>
<div id="a1"></div>
<div id="v2" hidden></div>
<div id="a2" hidden></div>
<div id="rc" hidden></div>
<script>
// PUBLICITÉS : laisser client vide = simple espace réservé. Renseigner client ("ca-pub-...") et slot1/slot2 pour afficher de vraies annonces.
var ADS={enabled:true,client:"",slot1:"",slot2:""},adDone={};
if(ADS.enabled&&ADS.client){var sc=document.createElement("script");sc.async=true;sc.crossOrigin="anonymous";sc.src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client="+ADS.client;document.head.appendChild(sc)}
function ad(i){
  var el=document.getElementById("a"+i);
  if(!ADS.enabled||adDone[i])return;
  adDone[i]=1;el.className="ad";
  if(!ADS.client){el.textContent="Espace publicitaire";return}
  el.innerHTML='<ins class="adsbygoogle" style="display:block;width:100%" data-ad-client="'+ADS.client+'" data-ad-slot="'+ADS["slot"+i]+'" data-ad-format="auto" data-full-width-responsive="true"></ins>';
  try{(window.adsbygoogle=window.adsbygoogle||[]).push({})}catch(e){}
}
// [nom, quantité, unité, prix €, catégorie] — L légumes/fruits, V viande/poisson, C crèmerie, E épicerie
var CAT={L:"Légumes et fruits",V:"Viandes et poisson",C:"Crèmerie",E:"Épicerie"};
var DAYS=[],WEEK="";
var off={},done={},KEY="menus-v2",cache=null,n=1,c=0;
try{var s=JSON.parse(localStorage.getItem(KEY)||"{}");off=s.off||{};done=s.done||{};cache=s.data||null;n=s.n||1;c=s.c||0;WEEK=s.week||""}catch(e){}
function save(d){try{localStorage.setItem(KEY,JSON.stringify({off:off,done:done,week:WEEK,n:n,c:c,data:d||cache}))}catch(e){}}
function eur(x){return x.toFixed(2).replace(".",",")+" €"}
function qty(q,u){if(u==="g"&&q>=1000)return (q/1000).toString().replace(".",",")+" kg";if(u==="ml"&&q>=1000)return (q/1000)+" l";return q+(u?" "+u:"")}
function renderMenus(){
  var h="";
  DAYS.forEach(function(d,i){
    h+='<div class="day"><h2>'+d[0]+'</h2>';
    [1,2].forEach(function(k){
      var id=i+"-"+k,m=d[k],o=off[id];
      h+='<div class="meal'+(o?" off":"")+'"><span class="s">'+(k===1?"Midi":"Soir")+'</span><span class="n" data-r="'+id+'" role="button" tabindex="0">'+m[0]+(m[2]?'<small>'+m[2].t+' · voir la recette</small>':'')+'</span><button data-id="'+id+'">'+(o?"Remettre":"Retirer")+'</button></div>';
    });
    h+='</div>';
  });
  h+='<button class="reset" id="rs">Nouvelle semaine (tout remettre)</button>';
  document.getElementById("v1").innerHTML=h;
}
function renderList(){
  var agg={},f=n+c*0.5;
  DAYS.forEach(function(d,i){[1,2].forEach(function(k){
    if(off[i+"-"+k])return;
    d[k][1].forEach(function(g){
      var key=g[0]+"|"+g[2];
      if(!agg[key])agg[key]={n:g[0],u:g[2],q:0,p:0,c:g[4]};
      agg[key].q+=g[1]*f;agg[key].p+=g[3]*f;
    });
  })});
  var items=Object.keys(agg).map(function(k){var x=Object.assign({k:k},agg[k]);x.q=x.u===""?Math.ceil(x.q-1e-9):(x.q>=50?Math.round(x.q/5)*5:Math.round(x.q));return x});
  var tot=0,h="";
  Object.keys(CAT).forEach(function(c){
    var l=items.filter(function(x){return x.c===c}).sort(function(a,b){return a.n.localeCompare(b.n,"fr")});
    if(!l.length)return;
    h+='<div class="cat">'+CAT[c]+'</div>';
    l.forEach(function(x){
      tot+=x.p;
      h+='<label class="it'+(done[x.k]?" done":"")+'"><input type="checkbox" data-k="'+x.k+'"'+(done[x.k]?" checked":"")+'><span class="n">'+x.n+' <span class="q">'+qty(x.q,x.u)+'</span></span><span class="p">'+eur(x.p)+'</span></label>';
    });
  });
  if(!items.length)h='<p class="sub">Aucun repas sélectionné.</p>';
  h+='<div class="tot"><span>Total estimé</span><span>'+eur(tot)+'</span></div><div class="note">Prix approximatifs, selon l’enseigne et la région. Un enfant compte pour une demi-portion.</div>';
  document.getElementById("v2").innerHTML=h;
}
function show(n){
  document.getElementById("v1").hidden=n!==1;document.getElementById("v2").hidden=n!==2;document.getElementById("a1").hidden=n!==1;document.getElementById("a2").hidden=n!==2;
  document.getElementById("t1").className=n===1?"on":"";document.getElementById("t2").className=n===2?"on":"";
  if(n===2){renderList();ad(2)}
}
function fixq(q,u){return u===""?Math.ceil(q-1e-9):(q>=50?Math.round(q/5)*5:Math.round(q))}
function lab(){return n+" adulte"+(n>1?"s":"")+(c?" et "+c+" enfant"+(c>1?"s":""):"")}
function openR(id){
  var p=id.split("-"),m=DAYS[+p[0]][+p[1]],r=m[2],f=n+c*0.5,h='<div class="sh"><button class="x" id="cx" aria-label="Fermer">×</button><h3>'+m[0]+'</h3>';
  if(!r){h+='<p class="sub">Recette bientôt disponible.</p>'}
  else{
    h+='<div class="sub">'+r.t+' · ingrédients pour '+lab()+'</div><h4>Ingrédients</h4><ul>';
    m[1].forEach(function(g){h+='<li>'+g[0]+' <span class="q">'+qty(fixq(g[1]*f,g[2]),g[2])+'</span></li>'});
    h+='</ul><h4>Préparation</h4><ol>';
    r.e.forEach(function(s){h+='<li>'+s+'</li>'});
    h+='</ol><div class="note">Étapes écrites pour 1 portion : adaptez les temps de cuisson si vous cuisinez en plus grande quantité.</div>';
  }
  var el=document.getElementById("rc");el.innerHTML=h+'</div>';el.hidden=false;
}
document.getElementById("rc").onclick=function(e){if(e.target===this||e.target.id==="cx")this.hidden=true};
function setN(){document.getElementById("nn").textContent=n;document.getElementById("nc").textContent=c}
function chg(d,k){if(k)c=Math.max(0,Math.min(12,c+d));else n=Math.max(1,Math.min(12,n+d));save();setN();if(!document.getElementById("v2").hidden)renderList()}
document.getElementById("mn").onclick=function(){chg(-1)};
document.getElementById("pl").onclick=function(){chg(1)};
document.getElementById("cm").onclick=function(){chg(-1,1)};
document.getElementById("cp").onclick=function(){chg(1,1)};
setN();
document.getElementById("t1").onclick=function(){show(1)};
document.getElementById("t2").onclick=function(){show(2)};
document.getElementById("v1").addEventListener("click",function(e){
  var rr=e.target.closest&&e.target.closest("[data-r]");
  if(rr){openR(rr.getAttribute("data-r"));return}
  var id=e.target.getAttribute&&e.target.getAttribute("data-id");
  if(id){if(off[id])delete off[id];else off[id]=1;save();renderMenus()}
  if(e.target.id==="rs"){off={};done={};save();renderMenus()}
});
document.getElementById("v2").addEventListener("change",function(e){
  var k=e.target.getAttribute("data-k");
  if(k){if(e.target.checked)done[k]=1;else delete done[k];save();renderList()}
});
function init(d){
  if(WEEK!==d.semaine){off={};done={};WEEK=d.semaine}
  DAYS=d.jours;cache=d;save(d);
  document.getElementById("wk").textContent=WEEK;renderMenus();
}
ad(1);
if(cache){DAYS=cache.jours;document.getElementById("wk").textContent=cache.semaine;renderMenus()}
fetch("menus.json",{cache:"no-cache"}).then(function(r){return r.json()}).then(init).catch(function(){
  if(!cache)document.getElementById("v1").innerHTML='<p class="sub">Connexion nécessaire au premier lancement.</p>';
});
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
