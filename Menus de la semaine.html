<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menus de la semaine</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#2b2620;--mu:#7a7266;--ac:#c2512f;--bd:#e8e1d6;--ok:#4d7c4f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1915;--card:#27231e;--tx:#f0ebe2;--mu:#a39a8c;--ac:#e8795a;--bd:#3a352d;--ok:#8ab98c}}
:root[data-theme="dark"]{--bg:#1c1915;--card:#27231e;--tx:#f0ebe2;--mu:#a39a8c;--ac:#e8795a;--bd:#3a352d;--ok:#8ab98c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;max-width:560px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--mu);font-size:14px;margin-bottom:14px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-weight:600}
.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.day{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.day h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:0 0 6px}
.meal{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--bd)}
.meal:first-of-type{border-top:0}
.meal .s{font-size:12px;color:var(--mu);width:42px;flex:none}
.meal .n{flex:1}
.meal .n small{display:block;color:var(--mu);font-size:12px}
.meal.off .n{text-decoration:line-through;color:var(--mu)}
.meal button{border:1px solid var(--bd);background:none;color:var(--ac);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px}
.cat{font-size:13px;font-weight:700;color:var(--ac);margin:16px 0 4px}
.it{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd)}
.it input{width:20px;height:20px;accent-color:var(--ok)}
.it .n{flex:1}.it.done .n{text-decoration:line-through;color:var(--mu)}
.it .q{color:var(--mu);font-size:14px}.it .p{width:60px;text-align:right;font-size:14px}
.tot{position:sticky;bottom:0;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:16px;display:flex;justify-content:space-between;font-weight:700}
.reset{margin-top:18px;width:100%;padding:11px;border:1px dashed var(--bd);background:none;color:var(--mu);border-radius:10px;font:inherit}
.note{color:var(--mu);font-size:12px;margin-top:10px}
</style>
</head>
<body>
<h1>Menus de la semaine</h1>
<div class="sub">1 personne · de saison · petit budget</div>
<div class="tabs"><button id="t1" class="on">Menus</button><button id="t2">Courses</button></div>
<div id="v1"></div>
<div id="v2" hidden></div>
<script>
// [nom, quantité, unité, prix €, catégorie] — L légumes/fruits, V viande/poisson, C crèmerie, E épicerie
var CAT={L:"Légumes et fruits",V:"Viandes et poisson",C:"Crèmerie",E:"Épicerie"};
var DAYS=[
["Lundi",["Omelette aux champignons",[["Œufs",3,"",.9,"C"],["Champignons",150,"g",.8,"L"],["Beurre",10,"g",.1,"C"]]],["Velouté de potiron",[["Potimarron",400,"g",1,"L"],["Pommes de terre",100,"g",.2,"L"],["Oignons",1,"",.2,"L"],["Crème fraîche",30,"g",.2,"C"]]]],
["Mardi",["Salade de lentilles",[["Lentilles vertes",80,"g",.3,"E"],["Carottes",100,"g",.2,"L"],["Œufs",1,"",.3,"C"],["Oignons",1,"",.2,"L"]]],["Gratin de chou-fleur au jambon",[["Chou-fleur",400,"g",1.2,"L"],["Jambon blanc (tranches)",2,"",.8,"V"],["Fromage râpé",50,"g",.5,"C"],["Lait",200,"ml",.2,"C"],["Beurre",10,"g",.1,"C"]]]],
["Mercredi",["Quiche poireaux-chèvre",[["Poireaux",2,"",1.2,"L"],["Pâte brisée",1,"",1,"E"],["Œufs",2,"",.6,"C"],["Chèvre",50,"g",.8,"C"],["Crème fraîche",50,"g",.3,"C"]]],["Steak haché, purée de patates douces",[["Steak haché",1,"",1.3,"V"],["Patates douces",300,"g",.8,"L"],["Beurre",10,"g",.1,"C"]]]],
["Jeudi",["Salade d’endives, pommes, noix",[["Endives",2,"",1,"L"],["Pommes",1,"",.4,"L"],["Noix",30,"g",.6,"E"],["Chèvre",30,"g",.5,"C"]]],["Risotto au potimarron",[["Riz rond",80,"g",.3,"E"],["Potimarron",300,"g",.8,"L"],["Oignons",1,"",.2,"L"],["Fromage râpé",30,"g",.3,"C"],["Bouillon cube",1,"",.1,"E"]]]],
["Vendredi",["Pâtes aux champignons",[["Pâtes",100,"g",.2,"E"],["Champignons",200,"g",1,"L"],["Crème fraîche",50,"g",.3,"C"],["Ail (gousse)",1,"",.1,"L"]]],["Colin en papillote",[["Colin (filet)",1,"",3,"V"],["Carottes",150,"g",.3,"L"],["Beurre",10,"g",.1,"C"]]]],
["Samedi",["Tartines courge et chèvre",[["Potimarron",250,"g",.6,"L"],["Pain",100,"g",.3,"E"],["Chèvre",50,"g",.8,"C"]]],["Burger maison, frites au four",[["Steak haché",1,"",1.3,"V"],["Pains à burger",1,"",.5,"E"],["Salade",50,"g",.3,"L"],["Oignons",1,"",.2,"L"],["Pommes de terre",250,"g",.5,"L"]]]],
["Dimanche",["Poulet rôti, pommes de terre, carottes",[["Cuisses de poulet",2,"",2.5,"V"],["Pommes de terre",300,"g",.6,"L"],["Carottes",200,"g",.3,"L"]]],["Soupe de lentilles corail",[["Lentilles corail",80,"g",.3,"E"],["Lait de coco",200,"ml",.7,"E"],["Carottes",100,"g",.2,"L"],["Oignons",1,"",.2,"L"],["Bouillon cube",1,"",.1,"E"]]]]
];
var off={},done={},KEY="menus-v1";
try{var s=JSON.parse(localStorage.getItem(KEY)||"{}");off=s.off||{};done=s.done||{}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({off:off,done:done}))}catch(e){}}
function eur(x){return x.toFixed(2).replace(".",",")+" €"}
function qty(q,u){if(u==="g"&&q>=1000)return (q/1000).toString().replace(".",",")+" kg";if(u==="ml"&&q>=1000)return (q/1000)+" l";return q+(u?" "+u:"")}
function renderMenus(){
  var h="";
  DAYS.forEach(function(d,i){
    h+='<div class="day"><h2>'+d[0]+'</h2>';
    [1,2].forEach(function(k){
      var id=i+"-"+k,m=d[k],o=off[id];
      h+='<div class="meal'+(o?" off":"")+'"><span class="s">'+(k===1?"Midi":"Soir")+'</span><span class="n">'+m[0]+'</span><button data-id="'+id+'">'+(o?"Remettre":"Retirer")+'</button></div>';
    });
    h+='</div>';
  });
  h+='<button class="reset" id="rs">Nouvelle semaine (tout remettre)</button>';
  document.getElementById("v1").innerHTML=h;
}
function renderList(){
  var agg={};
  DAYS.forEach(function(d,i){[1,2].forEach(function(k){
    if(off[i+"-"+k])return;
    d[k][1].forEach(function(g){
      var key=g[0]+"|"+g[2];
      if(!agg[key])agg[key]={n:g[0],u:g[2],q:0,p:0,c:g[4]};
      agg[key].q+=g[1];agg[key].p+=g[3];
    });
  })});
  var items=Object.keys(agg).map(function(k){return Object.assign({k:k},agg[k])});
  var tot=0,h="";
  Object.keys(CAT).forEach(function(c){
    var l=items.filter(function(x){return x.c===c}).sort(function(a,b){return a.n.localeCompare(b.n,"fr")});
    if(!l.length)return;
    h+='<div class="cat">'+CAT[c]+'</div>';
    l.forEach(function(x){
      tot+=x.p;
      h+='<label class="it'+(done[x.k]?" done":"")+'"><input type="checkbox" data-k="'+x.k+'"'+(done[x.k]?" checked":"")+'><span class="n">'+x.n+' <span class="q">'+qty(x.q,x.u)+'</span></span><span class="p">'+eur(x.p)+'</span></label>';
    });
  });
  if(!items.length)h='<p class="sub">Aucun repas sélectionné.</p>';
  h+='<div class="tot"><span>Total estimé</span><span>'+eur(tot)+'</span></div><div class="note">Prix approximatifs, selon l’enseigne et la région.</div>';
  document.getElementById("v2").innerHTML=h;
}
function show(n){
  document.getElementById("v1").hidden=n!==1;document.getElementById("v2").hidden=n!==2;
  document.getElementById("t1").className=n===1?"on":"";document.getElementById("t2").className=n===2?"on":"";
  if(n===2)renderList();
}
document.getElementById("t1").onclick=function(){show(1)};
document.getElementById("t2").onclick=function(){show(2)};
document.getElementById("v1").addEventListener("click",function(e){
  var id=e.target.getAttribute&&e.target.getAttribute("data-id");
  if(id){if(off[id])delete off[id];else off[id]=1;save();renderMenus()}
  if(e.target.id==="rs"){off={};done={};save();renderMenus()}
});
document.getElementById("v2").addEventListener("change",function(e){
  var k=e.target.getAttribute("data-k");
  if(k){if(e.target.checked)done[k]=1;else delete done[k];save();renderList()}
});
renderMenus();
</script>
</body>
</html>
